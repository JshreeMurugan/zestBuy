name: build android app
on:
    workflow_dispatch:
jobs:
    build-android:
        runs-on: macos-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v3

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22' # Adjust to the Node version your project requires
                  cache: 'npm'
                  
            - name: build web app
              run: |
                npm run build
            - name: prepare android app
              run: |
                ionic cordova prepare android
            - name: build android app
              run: |
                ionic cordova build android --prod





